spring.application.name=fourth
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS}
# Comma-separated browser origins allowed to call the API (CORS)
# Example for a phone on the same Wi‑Fi: set APP_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://<YOUR_LAN_IP>:3000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Examination pass QR tokens remain valid until this many hours after the last exam end_time
app.exam-pass.qr-validity-hours-after-end=6
server.address=0.0.0.0
server.port=${PORT:8080}
